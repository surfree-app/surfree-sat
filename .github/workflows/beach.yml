# Once a day: measure where waves break on new Sentinel-2 images of Surfree's Portugal spots and send the result
# (a few numbers per image) to the Surfree worker. ~1-2 minutes per run; one small POST, only when there are new images.
name: Beach check
on:
  schedule:
    - cron: '50 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: beach
  cancel-in-progress: true
jobs:
  beach:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install --only-binary=:all: -r requirements.txt
      - run: python beachcheck.py
        env:
          REFRESH_KEY: ${{ secrets.REFRESH_KEY }}
          SURFREE_URL: https://surfree.surfree.workers.dev
